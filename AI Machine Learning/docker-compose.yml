# docker compose run --rm trainer        # simulate + train + score + monitor
# docker compose up -d api mlflow        # serve predictions and browse experiments
services:
  trainer:
    build: .
    command: ["pipeline"]
    volumes: ["artifacts:/app/artifacts"]
    profiles: ["jobs"]

  api:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes: ["artifacts:/app/artifacts"]
    restart: unless-stopped

  mlflow:
    build: .
    entrypoint: ["mlflow"]
    command: ["ui", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////app/artifacts/mlflow.db"]
    ports: ["5000:5000"]
    volumes: ["artifacts:/app/artifacts"]

volumes:
  artifacts:
