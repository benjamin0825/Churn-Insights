[build-system]
requires = ["setuptools>=68", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-ml"
version = "2.0.0"
description = "End-to-end customer churn ML platform: simulation, point-in-time features, tuned ensembles, registry, SHAP, drift monitoring and a REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    # CPU build recommended: pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.2",
    "optuna>=3.6",
    "shap>=0.45",
    "mlflow>=2.12",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "pyyaml>=6",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "joblib>=1.3",
    # Newer MSVC runtime DLLs for torch on older Windows images (see churn_ml/_runtime.py)
    "msvc-runtime; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
# Build churn_ml._kernels_ext without a system C compiler (scripts/build_native.py --zig)
native = ["cython>=3.0", "ziglang>=0.13"]

[project.scripts]
churn-ml = "churn_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churn_ml = ["reporting/templates/*", "*.pyx", "_native/*.pyd", "_native/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["slow: end-to-end tests that train real models"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:X does not have valid feature names:UserWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/churn_ml/_kernels_ext.c"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]
